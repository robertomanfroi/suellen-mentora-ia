<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suellen Warmling — Mentora IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --laranja: #FC4C04;
      --preto: #101010;
      --creme: #FCE9D9;
      --creme-escuro: #f5d9c4;
      --branco: #ffffff;
      --cinza: #6b6b6b;
      --cinza-claro: #f0f0f0;
      --bubble-user: #FC4C04;
      --bubble-suellen: #ffffff;
      --sombra: 0 4px 24px rgba(16,16,16,0.10);
    }

    body {
      font-family: 'Instrument Sans', sans-serif;
      background: var(--creme);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HEADER ── */
    header {
      width: 100%;
      background: var(--preto);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--laranja);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--branco);
      flex-shrink: 0;
    }

    .header-info h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--branco);
      line-height: 1.2;
    }

    .header-info p {
      font-size: 12px;
      color: #aaa;
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      display: inline-block;
      margin-right: 5px;
    }

    /* ── CHAT CONTAINER ── */
    .chat-wrapper {
      width: 100%;
      max-width: 720px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── WELCOME ── */
    .welcome {
      text-align: center;
      padding: 32px 16px 16px;
    }

    .welcome .avatar-lg {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--laranja);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: var(--branco);
      margin: 0 auto 16px;
    }

    .welcome h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--preto);
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 14px;
      color: var(--cinza);
      line-height: 1.6;
      max-width: 400px;
      margin: 0 auto 24px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .suggestion-btn {
      background: var(--branco);
      border: 1.5px solid var(--creme-escuro);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-family: 'Instrument Sans', sans-serif;
      color: var(--preto);
      cursor: pointer;
      transition: all 0.15s;
    }

    .suggestion-btn:hover {
      border-color: var(--laranja);
      color: var(--laranja);
      background: #fff5f0;
    }

    /* ── BUBBLES ── */
    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.suellen {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      margin-top: 2px;
    }

    .message.suellen .msg-avatar {
      background: var(--laranja);
      color: var(--branco);
    }

    .message.user .msg-avatar {
      background: var(--preto);
      color: var(--branco);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .message.suellen .bubble {
      background: var(--bubble-suellen);
      color: var(--preto);
      border-bottom-left-radius: 4px;
      box-shadow: var(--sombra);
    }

    .message.user .bubble {
      background: var(--bubble-user);
      color: var(--branco);
      border-bottom-right-radius: 4px;
    }

    /* ── TYPING ── */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ccc;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── INPUT ── */
    .input-area {
      padding: 12px 0 20px;
      position: sticky;
      bottom: 0;
      background: var(--creme);
    }

    .input-row {
      display: flex;
      gap: 10px;
      background: var(--branco);
      border: 1.5px solid var(--creme-escuro);
      border-radius: 28px;
      padding: 6px 8px 6px 20px;
      box-shadow: var(--sombra);
      transition: border-color 0.15s;
    }

    .input-row:focus-within {
      border-color: var(--laranja);
    }

    #user-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 15px;
      color: var(--preto);
      background: transparent;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      padding: 6px 0;
    }

    #user-input::placeholder { color: #aaa; }

    #send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--laranja);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    #send-btn:hover { background: #e04400; }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { background: #ddd; cursor: not-allowed; }

    #send-btn svg { width: 18px; height: 18px; fill: white; }

    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: #bbb;
      margin-top: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .message { max-width: 92%; }
      .suggestions { flex-direction: column; align-items: center; }
      .suggestion-btn { width: 100%; max-width: 300px; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="avatar">S</div>
    <div class="header-info">
      <h1>Suellen Warmling</h1>
      <p><span class="status-dot"></span>Mentora IA · Mentoria Sublime</p>
    </div>
  </header>

  <div class="chat-wrapper">
    <div id="messages">
      <div class="welcome" id="welcome">
        <div class="avatar-lg">S</div>
        <h2>Oi, sublime! 👋</h2>
        <p>Sou a Suellen Warmling, sua mentora de marketing digital. Pode me perguntar sobre Instagram, conteúdo, vendas ou qualquer dúvida do seu negócio.</p>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="sendSuggestion(this)">Não sei por onde começar no Instagram</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">Minhas visualizações de stories caíram</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">Como criar conteúdo sem tempo?</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">Quero vender mais no direct</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea
          id="user-input"
          placeholder="Escreva sua dúvida aqui..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button id="send-btn" onclick="sendMessage()" title="Enviar">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <p class="disclaimer">Assistente IA baseado nos ensinamentos da Suellen Warmling · Mentoria Sublime</p>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    let history = [];
    let isLoading = false;

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendSuggestion(btn) {
      inputEl.value = btn.textContent;
      sendMessage();
    }

    function removeWelcome() {
      const w = document.getElementById('welcome');
      if (w) w.remove();
    }

    function appendMessage(role, text) {
      removeWelcome();
      const wrap = document.createElement('div');
      wrap.className = `message ${role}`;

      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = role === 'suellen' ? 'S' : 'V';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      wrap.appendChild(av);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollBottom();
      return wrap;
    }

    function appendTyping() {
      removeWelcome();
      const wrap = document.createElement('div');
      wrap.className = 'message suellen typing';
      wrap.id = 'typing-indicator';

      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = 'S';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

      wrap.appendChild(av);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollBottom();
    }

    function removeTyping() {
      const t = document.getElementById('typing-indicator');
      if (t) t.remove();
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isLoading) return;

      isLoading = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      appendMessage('user', text);
      history.push({ role: 'user', content: text });

      appendTyping();

      try {
        const res = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });

        const data = await res.json();
        removeTyping();

        if (data.error) {
          appendMessage('suellen', 'Ops, tive um problema técnico. Tenta de novo daqui a pouco, tá?');
          history.pop();
        } else {
          appendMessage('suellen', data.content);
          history.push({ role: 'assistant', content: data.content });
        }
      } catch {
        removeTyping();
        appendMessage('suellen', 'Ops, perdi a conexão. Tenta de novo, tá?');
        history.pop();
      }

      isLoading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  </script>

</body>
</html>
