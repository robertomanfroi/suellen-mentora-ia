name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos
  workflow_dispatch:          # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://web-production-4cd25.up.railway.app/ping)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "AVISO: serviço retornou $STATUS"
            exit 1
          fi
